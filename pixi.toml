[workspace]
authors = ["Mahesh Binzer-Panchal <mahesh.binzer-panchal@nbis.se>"]
channels = ["conda-forge", "bioconda"]
name = "nf-icechunk-records"
platforms = ["linux-64", "osx-arm64", "linux-aarch64"]
version = "0.1.0"

[tasks]
icechunk-stages = "nextflow run main.nf"
lint = "nextflow lint main.nf"
test-resume = "bash tests/resume.sh"
clean-work = "nextflow clean -f -before last && find work -type d -empty -delete"
clean-all = "nextflow clean -f; rm -rf work results icechunk_stores .nextflow*"

[dependencies]
nextflow = ">=26.10.0,<27"
